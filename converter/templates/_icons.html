{# Small line icons for the category tabs. They use currentColor, so they
   take the text colour in both themes. aria-hidden: the tab text says it all. #}
{% macro category_icon(key) %}
<svg class="icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"
     fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  {% if key == "length" %}
    <rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 7v4M10 7v3M14 7v4M18 7v3"/>
  {% elif key == "weight" %}
    <circle cx="12" cy="5" r="2.5"/><path d="M6.5 8h11L20 20H4z"/>
  {% elif key == "temperature" %}
    <path d="M14 14.76V4a2 2 0 0 0-4 0v10.76a4 4 0 1 0 4 0z"/>
  {% elif key == "area" %}
    <path d="M3 8V5a2 2 0 0 1 2-2h3M16 3h3a2 2 0 0 1 2 2v3M21 16v3a2 2 0 0 1-2 2h-3M8 21H5a2 2 0 0 1-2-2v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/>
  {% elif key == "volume" %}
    <path d="M9 3h6M10 3v6l-5 10a1.5 1.5 0 0 0 1.3 2h11.4a1.5 1.5 0 0 0 1.3-2L14 9V3"/><path d="M7.5 15h9"/>
  {% elif key == "speed" %}
    <path d="M4.9 19A9 9 0 1 1 19.1 19"/><path d="m12 13.5 4-4.5"/><circle cx="12" cy="13.5" r="1.2"/>
  {% elif key == "time" %}
    <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
  {% elif key == "data" %}
    <ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.7 3.6 3 8 3s8-1.3 8-3V5"/><path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3"/>
  {% endif %}
</svg>
{% endmacro %}
