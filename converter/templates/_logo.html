{# The Swap Meter logo: a meter (the needle) above two arrows (the swap).

   colours: .logo-teal and .logo-orange use theme variables (lighter teal in dark mode). #}
{% macro logo(class="brand-logo") %}
<svg class="{{ class }}" viewBox="165 169 470 470" aria-hidden="true" focusable="false">

      <path d="M529 573H271M307 544l-36 29 36 29" stroke-width="32"/>
    </g>
    <g class="logo-orange">
      <circle cx="400" cy="404" r="27" stroke-width="26"/>
      <path d="M414 378 462 286" stroke-width="30"/>
      <path d="M271 492h258M493 463l36 29-36 29" stroke-width="32"/>
    </g>
  </g>
</svg>
{% endmacro %}
